<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Shmup: Galaga Chronicles</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .highlight { color: #f59e0b; }
        .score-hl { color: #10b981; }

        #canvas-container {
            position: relative;
            background: #000;
            border: 4px solid #334155;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            width: 100%;
            aspect-ratio: 4 / 5;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        #overlay h2 {
            font-size: 2rem;
            color: #f43f5e;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #9f1239;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #9f1239;
        }

        /* --- PHONE HANDSET CONTROL BOARD --- */
        #mobile-controller {
            display: none;
            width: 100%;
            margin-top: 15px;
            gap: 15px;
        }

        .ctrl-btn {
            flex: 1;
            background: #1e293b;
            border: 2px solid #475569;
            color: white;
            font-size: 1.5rem;
            height: 55px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            background: #3b82f6;
        }

        @media (max-width: 768px), (pointer: coarse) {
            #mobile-controller { display: flex; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <header>
            <div>WAVE: <span id="lbl-wave" class="highlight">1</span></div>
            <div>SCORE: <span id="lbl-score" class="score-hl">0</span></div>
            <div>SHIELD: <span id="lbl-hp" style="color:#ef4444;">100%</span></div>
        </header>

        <div id="canvas-container">
            <canvas id="shmupCanvas" width="400" height="500"></canvas>
            
            <div id="overlay">
                <h2 id="overlay-title">GALAGA WARS</h2>
                <p id="overlay-desc" style="font-size:0.85rem; color:#94a3b8; margin-bottom:20px;">Use Mouse, Arrow keys, or Touch buttons to navigate and intercept enemies</p>
                <button onclick="startGame()">LAUNCH FIGHTER</button>
            </div>
        </div>

        <div id="mobile-controller">
            <button class="ctrl-btn" id="btn-left">◀ MOVE LEFT</button>
            <button class="ctrl-btn" id="btn-right">MOVE RIGHT ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('shmupCanvas');
        const ctx = canvas.getContext('2d');

        const lblWave = document.getElementById('lbl-wave');
        const lblScore = document.getElementById('lbl-score');
        const lblHp = document.getElementById('lbl-hp');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');

        // Logic Global States
        let gameActive = false;
        let score = 0;
        let wave = 1;
        let playerHp = 100;

        // Player configuration
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 45,
            w: 32,
            h: 24,
            speed: 6,
            movingLeft: false,
            movingRight: false
        };

        // Storage arrays
        let playerLasers = [];
        let enemyLasers = [];
        let enemies = [];
        let starfield = [];

        // Game loop configuration pacing parameters
        let lastLaserTime = 0;
        let laserCooldown = 280; // auto fire velocity
        let enemyFireRate = 0.006; // basic spawn laser dynamic percentage

        // Generate parallax space star background environment vectors
        for (let i = 0; i < 45; i++) {
            starfield.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 2 + 0.5,
                size: Math.random() * 1.8 + 0.5
            });
        }

        function startGame() {
            score = 0; wave = 1; playerHp = 100;
            player.x = canvas.width / 2 - player.w / 2;
            playerLasers = []; enemyLasers = []; enemies = [];
            
            updateUI();
            overlay.style.display = 'none';
            gameActive = true;
            
            generateWave();
        }

        function generateWave() {
            enemies = [];
            enemyFireRate = 0.005 + (wave * 0.002);
            
            const rows = Math.min(5, 2 + Math.floor(wave / 2));
            const cols = 6;
            const blockW = 35;
            const blockH = 22;
            const gapX = 20;
            const gapY = 15;
            
            const totalWidth = (cols * blockW) + ((cols - 1) * gapX);
            const startX = (canvas.width - totalWidth) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    enemies.push({
                        x: startX + c * (blockW + gapX),
                        y: 40 + r * (blockH + gapY),
                        w: blockW,
                        h: blockH,
                        color: r === 0 ? '#ef4444' : r % 2 === 0 ? '#3b82f6' : '#a855f7',
                        hp: r === 0 ? 2 : 1, // Top rows have double shield capacity
                        dir: 1,
                        speed: 0.8 + (wave * 0.15)
                    });
                }
            }
        }

        function updateUI() {
            lblScore.innerText = score;
            lblWave.innerText = wave;
            lblHp.innerText = `${playerHp}%`;
        }

        // --- PHYSICS PROCESSING CORE ---
        function updateEngine() {
            if (!gameActive) return;

            // 1. Parallax Stars translation steps
            starfield.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
            });

            // 2. Interceptor platform navigation physics
            if (player.movingLeft) player.x -= player.speed;
            if (player.movingRight) player.x += player.speed;
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

            // 3. Auto firing system clock sync loops
            const now = Date.now();
            if (now - lastLaserTime > laserCooldown) {
                playerLasers.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 10 });
                lastLaserTime = now;
            }

            // 4. Player laser vectors movement step
            playerLasers.forEach((l, idx) => {
                l.y -= 7;
                if (l.y < 0) playerLasers.splice(idx, 1);
            });

            // 5. Enemy structure movement management matrix loops
            let switchDirection = false;
            enemies.forEach(e => {
                e.x += e.speed * e.dir;
                if (e.x + e.w > canvas.width || e.x < 0) switchDirection = true;
                
                // Random attack fire triggers
                if (Math.random() < enemyFireRate) {
                    enemyLasers.push({ x: e.x + e.w/2 - 2, y: e.y + e.h, w: 4, h: 10 });
                }
            });

            if (switchDirection) {
                enemies.forEach(e => {
                    e.dir *= -1;
                    e.y += 10; // Descend step
                    if (e.y + e.h >= player.y) triggerGameOver(false); // Breached perimeter defense
                });
            }

            // 6. Enemy projectile translation metrics
            enemyLasers.forEach((l, idx) => {
                l.y += 5;
                if (l.y > canvas.height) enemyLasers.splice(idx, 1);

                // Collision with player hull checking
                if (checkRectCollision(l, player)) {
                    enemyLasers.splice(idx, 1);
                    playerHp -= 20;
                    updateUI();
                    if (playerHp <= 0) triggerGameOver(false);
                }
            });

            // 7. Hit registration matrix intersections checks
            playerLasers.forEach((l, lIdx) => {
                enemies.forEach((e, eIdx) => {
                    if (checkRectCollision(l, e)) {
                        playerLasers.splice(lIdx, 1);
                        e.hp--;
                        if (e.hp <= 0) {
                            enemies.splice(eIdx, 1);
                            score += 50;
                            updateUI();
                        }
                    }
                });
            });

            // Wave completion transition checks
            if (enemies.length === 0) {
                wave++;
                updateUI();
                generateWave();
            }
        }

        function checkRectCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.w > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.h > rect2.y;
        }

        function triggerGameOver(victory) {
            gameActive = false;
            overlayTitle.innerText = "GAME OVER";
            overlayDesc.innerText = `Your Starfighter was destroyed at Wave ${wave}.\nFinal Score: ${score}`;
            overlay.style.display = 'flex';
        }

        // --- GRAPHICS DRAW FRAME STATE STAGE RENDER ---
        function renderScene() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Deep space environment stars
            ctx.fillStyle = '#ffffff';
            starfield.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

            // Player Starfighter assets mapping vectors shapes
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(player.x + player.w/2, player.y);
            ctx.lineTo(player.x + player.w, player.y + player.h);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.closePath();
            ctx.fill();

            // Player Lasers project elements draw
            ctx.fillStyle = '#22c55e';
            playerLasers.forEach(l => ctx.fillRect(l.x, l.y, l.w, l.h));

            // Enemy Swarm Invaders matrix objects render elements shapes
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Simple aesthetic accent lines mapping interior blocks configurations
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(e.x + 4, e.y + 4, e.w - 8, e.h - 8);
            });

            // Enemy Plasma orbs weapon beams indicators
            ctx.fillStyle = '#ef4444';
            enemyLasers.forEach(l => ctx.fillRect(l.x, l.y, l.w, l.h));
        }

        // --- EVENT CONTROLLERS BINDINGS ROUTERS ---
        window.addEventListener('keydown', e => {
            if (['Space', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.movingLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.movingRight = true;
        });

        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.movingLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') player.movingRight = false;
        });

        // Mouse canvas tracking override mappings controls configuration
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const relativeX = (e.clientX - rect.left) * (canvas.width / rect.width);
            player.x = relativeX - player.w/2;
        });

        // Touch Interaction elements mapping bindings actions execution routes router loops
        const btnL = document.getElementById('btn-left');
        const btnR = document.getElementById('btn-right');

        const mapLeft = (e) => { e.preventDefault(); player.movingLeft = true; };
        const unmapLeft = (e) => { e.preventDefault(); player.movingLeft = false; };
        const mapRight = (e) => { e.preventDefault(); player.movingRight = true; };
        const unmapRight = (e) => { e.preventDefault(); player.movingRight = false; };

        btnL.addEventListener('touchstart', mapLeft); btnL.addEventListener('touchend', unmapLeft);
        btnL.addEventListener('mousedown', mapLeft); btnL.addEventListener('mouseup', unmapLeft);
        btnR.addEventListener('touchstart', mapRight); btnR.addEventListener('touchend', unmapRight);
        btnR.addEventListener('mousedown', mapRight); btnR.addEventListener('mouseup', unmapRight);

        // Core Engine frame loop ticks pipeline
        function frameTick() {
            updateEngine();
            renderScene();
            requestAnimationFrame(frameTick);
        }

        frameTick();
    </script>
</body>
</html>
