<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade 2048: Cross-Platform Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #faf8ef;
            color: #776e65;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: bold;
            color: #776e65;
            line-height: 1;
        }

        .score-box {
            background: #bbada0;
            padding: 8px 20px;
            border-radius: 6px;
            color: #fff;
            text-align: center;
            font-weight: bold;
            min-width: 100px;
        }

        .score-box label {
            display: block;
            font-size: 0.75rem;
            color: #eee4da;
            text-transform: uppercase;
        }

        #score-val {
            font-size: 1.5rem;
        }

        /* 2048 Layout Grid */
        #grid-arena {
            position: relative;
            background: #bbada0;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
        }

        /* Static Background Slots */
        .grid-cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 4px;
            width: 100%;
            height: 100%;
        }

        /* Absolute Overlay Tiles */
        .tile {
            position: absolute;
            width: calc((100% - 24px - 36px) / 4); /* Accounting for outer padding + grid gaps */
            height: calc((100% - 24px - 36px) / 4);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            transition: all 0.1s ease-in-out;
            animation: spawn 0.2s ease-in-out;
        }

        /* Tile Color Matrix System */
        .tile-2    { background: #eee4da; color: #776e65; font-size: 2.2rem;}
        .tile-4    { background: #ede0c8; color: #776e65; font-size: 2.2rem;}
        .tile-8    { background: #f2b179; color: #f9f6f2; font-size: 2.2rem;}
        .tile-16   { background: #f59563; color: #f9f6f2; font-size: 2rem;}
        .tile-32   { background: #f67c5f; color: #f9f6f2; font-size: 2rem;}
        .tile-64   { background: #f65e3b; color: #f9f6f2; font-size: 2rem;}
        .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 1.7rem; box-shadow: 0 0 8px #edcf72;}
        .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 1.7rem; box-shadow: 0 0 12px #edcc61;}
        .tile-512  { background: #ecc850; color: #f9f6f2; font-size: 1.7rem; box-shadow: 0 0 16px #ecc850;}
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.4rem; box-shadow: 0 0 20px #edc53f;}
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.4rem; box-shadow: 0 0 24px #edc22e;}

        /* Game State Message Windows */
        #status-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(238, 228, 218, 0.73);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }

        #status-overlay h2 {
            font-size: 3rem;
            color: #776e65;
            margin-bottom: 15px;
        }

        button.reset-btn {
            background: #8f7a66;
            color: #f9f6f2;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        button.reset-btn:hover {
            background: #7f6a56;
        }

        /* Mobile Layout Visual D-Pad */
        #mobile-controller {
            display: none; /* Auto displayed on phones by initialization script */
            margin: 20px auto 0 auto;
            position: relative;
            width: 160px;
            height: 160px;
        }

        .dpad-btn {
            position: absolute;
            background: #bbada0;
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 6px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0px #8f7a66;
        }

        .dpad-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #8f7a66;
        }

        #btn-up    { top: 0; left: 55px; }
        #btn-left  { top: 55px; left: 0; }
        #btn-right { top: 55px; right: 0; }
        #btn-down  { bottom: 0; left: 55px; }

        @keyframes spawn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (pointer: coarse) {
            #mobile-controller {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <h1>2048</h1>
            <div class="score-box">
                <label>SCORE</label>
                <span id="score-val">0</span>
            </div>
        </header>

        <div id="grid-arena">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            
            <div id="tile-layer"></div>

            <div id="status-overlay">
                <h2 id="status-title">Game Over!</h2>
                <button class="reset-btn" onclick="initGame()">Try Again</button>
            </div>
        </div>

        <div id="mobile-controller">
            <button class="dpad-btn" id="btn-up" data-dir="UP">▲</button>
            <button class="dpad-btn" id="btn-left" data-dir="LEFT">◀</button>
            <button class="dpad-btn" id="btn-right" data-dir="RIGHT">▶</button>
            <button class="dpad-btn" id="btn-down" data-dir="DOWN">▼</button>
        </div>
    </div>

    <script>
        const tileLayer = document.getElementById('tile-layer');
        const scoreVal = document.getElementById('score-val');
        const statusOverlay = document.getElementById('status-overlay');
        const statusTitle = document.getElementById('status-title');
        const mobileController = document.getElementById('mobile-controller');

        let board = [];
        let score = 0;
        const size = 4;

        // Force enable D-pad overlay explicitly for phone interfaces
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            mobileController.style.display = 'block';
        }

        function initGame() {
            board = Array(size).fill(null).map(() => Array(size).fill(0));
            score = 0;
            scoreVal.innerText = score;
            statusOverlay.style.display = 'none';
            
            spawnRandomTile();
            spawnRandomTile();
            renderBoard();
        }

        function spawnRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                let cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function renderBoard() {
            tileLayer.innerHTML = '';
            
            // Extract dimension mappings relative to dynamic arena width metrics
            const arena = document.getElementById('grid-arena');
            const padding = 12;
            const gap = 12;
            const cellW = (arena.clientWidth - (padding * 2) - (gap * (size - 1))) / size;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] !== 0) {
                        const tile = document.createElement('div');
                        let val = board[r][c];
                        tile.className = `tile tile-${val}`;
                        tile.innerText = val;

                        // Precise absolute coordinates positioning
                        let topPos = padding + r * (cellW + gap);
                        let leftPos = padding + c * (cellW + gap);
                        
                        tile.style.top = `${topPos}px`;
                        tile.style.left = `${leftPos}px`;
                        tile.style.width = `${cellW}px`;
                        tile.style.height = `${cellW}px`;

                        tileLayer.appendChild(tile);
                    }
                }
            }
        }

        // --- Core Mechanical Slide and Merge Math Functions ---
        function slideLine(row) {
            // Drop zeros out completely
            let line = row.filter(val => val !== 0);
            // Merge matching sequential values
            for (let i = 0; i < line.length - 1; i++) {
                if (line[i] === line[i + 1]) {
                    line[i] *= 2;
                    score += line[i];
                    line.splice(i + 1, 1);
                }
            }
            // Pad array out with trailing zeros again
            while (line.length < size) {
                line.push(0);
            }
            return line;
        }

        function handleMove(direction) {
            let oldBoardJSON = JSON.stringify(board);

            if (direction === 'LEFT') {
                for (let r = 0; r < size; r++) board[r] = slideLine(board[r]);
            }
            else if (direction === 'RIGHT') {
                for (let r = 0; r < size; r++) {
                    board[r].reverse();
                    board[r] = slideLine(board[r]);
                    board[r].reverse();
                }
            }
            else if (direction === 'UP') {
                for (let c = 0; c < size; c++) {
                    let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    col = slideLine(col);
                    for (let r = 0; r < size; r++) board[r][c] = col[r];
                }
            }
            else if (direction === 'DOWN') {
                for (let c = 0; c < size; c++) {
                    let col = [board[0][c], board[1][c], board[2][c], board[3][c]].reverse();
                    col = slideLine(col);
                    col.reverse();
                    for (let r = 0; r < size; r++) board[r][c] = col[r];
                }
            }

            // Only run operations if action caused structural change on the layout
            if (oldBoardJSON !== JSON.stringify(board)) {
                scoreVal.innerText = score;
                spawnRandomTile();
                renderBoard();
                checkGameStates();
            }
        }

        function checkGameStates() {
            // Verify Win condition 2048 threshold
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 2048) {
                        statusTitle.innerText = "You Win!";
                        statusOverlay.style.display = 'flex';
                        return;
                    }
                }
            }

            // Check if moves are still possible
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c] === 0) return; // Open space exists
                    if (r < size - 1 && board[r][c] === board[r + 1][c]) return; // Vertical match possible
                    if (c < size - 1 && board[r][c] === board[r][c + 1]) return; // Horizontal match possible
                }
            }

            // No valid tiles left
            statusTitle.innerText = "Game Over!";
            statusOverlay.style.display = 'flex';
        }

        // --- Event Control Systems (Desktop Keyboard Setup) ---
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault(); // Stop native page viewport moving
            }
            
            if (e.code === 'ArrowLeft' || e.code === 'KeyA')  handleMove('LEFT');
            if (e.code === 'ArrowRight' || e.code === 'KeyD') handleMove('RIGHT');
            if (e.code === 'ArrowUp' || e.code === 'KeyW')    handleMove('UP');
            if (e.code === 'ArrowDown' || e.code === 'KeyS')  handleMove('DOWN');
        });

        // --- Event Control Systems (Mobile Controller Touch) ---
        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleMove(btn.getAttribute('data-dir'));
            });
            // Click fallback for manual testing
            btn.addEventListener('mousedown', () => {
                handleMove(btn.getAttribute('data-dir'));
            });
        });

        // Track window resizing adjustments cleanly
        window.addEventListener('resize', renderBoard);

        // Run engine
        initGame();
    </script>
</body>
</html>
