<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Whack-A-Mole</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(to bottom, #1e3a8a, #0f172a);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
            /* Custom Hammer Cursor for desktops */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='24' font-size='24'>🔨</text></svg>"), auto;
        }

        body:active {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='24' font-size='24' transform='rotate(-20 16 16)'>🔨</text></svg>"), auto;
        }

        #game-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.8);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .highlight {
            color: #fbbf24;
        }
        .time-highlight {
            color: #ef4444;
        }

        /* 3x3 Grid Board Layout */
        #field-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #166534; /* Rich Grass Green */
            padding: 20px;
            border-radius: 16px;
            border: 4px solid #14532d;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Hole Base Containers */
        .hole {
            position: relative;
            background: #451a03; /* Deep Dark Mud Dirt Color */
            border-radius: 50%;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 8px 0 rgba(0,0,0,0.7), 0 4px 0 rgba(255,255,255,0.1);
            overflow: hidden; /* Clips mole animation cleanly when it moves down */
        }

        /* The Mole Character Model */
        .mole {
            position: absolute;
            width: 80%;
            height: 85%;
            background: #78350f; /* Brown fur */
            border-radius: 50% 50% 0 0;
            left: 10%;
            bottom: -100%; /* Initially hidden deep down in the hole */
            transition: bottom 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.15);
            border: 3px solid #451a03;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
        }

        /* Cute Mole Face Features via CSS shapes */
        .mole::before {
            content: "👀";
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .mole::after {
            content: "👃";
            font-size: 0.8rem;
        }

        /* Trigger State classes via Javascript Engine */
        .hole.active .mole {
            bottom: 0; /* Pops up to actionable height status */
        }

        /* Hit Impact Visual Pop-ups */
        .mole.whacked {
            background: #b91c1c !important; /* Changes to hurt crimson color red */
            animation: shake 0.15s ease-in-out infinite;
        }
        
        .mole.whacked::before {
            content: "❌" !important;
        }

        /* Full Screen HUD Status Overlays */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 20;
            padding: 20px;
        }

        #overlay h2 {
            font-size: 2.5rem;
            color: #fbbf24;
            margin-bottom: 12px;
        }

        #overlay p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0px #15803d;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0px #15803d;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <header>
            <div>SCORE: <span id="lbl-score" class="highlight">0</span></div>
            <div>TIME LEFT: <span id="lbl-timer" class="time-highlight">30s</span></div>
        </header>

        <div id="field-grid">
            <div class="hole"><div class="mole" data-id="0"></div></div>
            <div class="hole"><div class="mole" data-id="1"></div></div>
            <div class="hole"><div class="mole" data-id="2"></div></div>
            <div class="hole"><div class="mole" data-id="3"></div></div>
            <div class="hole"><div class="mole" data-id="4"></div></div>
            <div class="hole"><div class="mole" data-id="5"></div></div>
            <div class="hole"><div class="mole" data-id="6"></div></div>
            <div class="hole"><div class="mole" data-id="7"></div></div>
            <div class="hole"><div class="mole" data-id="8"></div></div>

            <div id="overlay">
                <h2 id="overlay-title">WHACK-A-MOLE</h2>
                <p id="overlay-desc">Whack as many moles as possible before the timer runs out! Moles will pop up progressively faster over time.</p>
                <button id="overlay-btn" onclick="startGame()">START GAME</button>
            </div>
        </div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const lblScore = document.getElementById('lbl-score');
        const lblTimer = document.getElementById('lbl-timer');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const overlayBtn = document.getElementById('overlay-btn');

        // Logic Controls State Matrices
        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let lastHoleIndex = -1;
        
        let spawnTimeoutId = null;
        let gameCountdownIntervalId = null;

        // Dynamic Engine Speed Parameters (in milliseconds)
        let moleUpTime = 950;
        let minSpawnInterval = 600;
        let maxSpawnInterval = 1300;

        // Assign interactions natively for cross-platform compatibility
        moles.forEach(mole => {
            // Touchstart for mobile speed, mousedown for instant clicks
            mole.addEventListener('mousedown', (e) => handleWhack(e, mole));
            mole.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Stop secondary ghost click event triggers
                handleWhack(e, mole);
            });
        });

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            moleUpTime = 950;
            minSpawnInterval = 600;
            maxSpawnInterval = 1300;

            lblScore.innerText = score;
            lblTimer.innerText = timeLeft + "s";
            overlay.style.display = 'none';

            runGameTimer();
            runMoleSpawnerLoop();
        }

        function runGameTimer() {
            gameCountdownIntervalId = setInterval(() => {
                timeLeft--;
                lblTimer.innerText = timeLeft + "s";

                if (timeLeft <= 0) {
                    endGameSession();
                }
            }, 1000);
        }

        // Logic to randomize choosing holes safely without duplicates
        function pickRandomHole() {
            const index = Math.floor(Math.random() * holes.length);
            if (index === lastHoleIndex) {
                return pickRandomHole(); // Recurse to pick another hole
            }
            lastHoleIndex = index;
            return holes[index];
        }

        function runMoleSpawnerLoop() {
            if (!gameActive) return;

            const targetHole = pickRandomHole();
            const targetMole = targetHole.querySelector('.mole');
            
            // Wipe any legacy hit status modifications safely
            targetMole.classList.remove('whacked');
            targetHole.classList.add('active');

            // Set up difficulty shifts adaptively based on ongoing score tiers
            adjustDifficultyScaling();

            // Handle the time length that a mole spends active above ground
            setTimeout(() => {
                targetHole.classList.remove('active');
                
                // Chain continue looping engine actions iteratively
                if (gameActive) {
                    let randomSpawnDelay = Math.random() * (maxSpawnInterval - minSpawnInterval) + minSpawnInterval;
                    spawnTimeoutId = setTimeout(runMoleSpawnerLoop, randomSpawnDelay);
                }
            }, moleUpTime);
        }

        function handleWhack(event, selectedMole) {
            const associatedHole = selectedMole.parentElement;
            
            // Check validation security constraints: space must be actively occupied
            if (!associatedHole.classList.contains('active') || selectedMole.classList.contains('whacked')) return;

            score += 10;
            lblScore.innerText = score;
            
            selectedMole.classList.add('whacked');

            // Force rapid descent animation immediately upon being whacked
            setTimeout(() => {
                associatedHole.classList.remove('active');
            }, 200);
        }

        function adjustDifficultyScaling() {
            if (score >= 150) {
                moleUpTime = 550; minSpawnInterval = 300; maxSpawnInterval = 600;
            } else if (score >= 100) {
                moleUpTime = 680; minSpawnInterval = 400; maxSpawnInterval = 800;
            } else if (score >= 50) {
                moleUpTime = 800; minSpawnInterval = 500; maxSpawnInterval = 1000;
            }
        }

        function endGameSession() {
            gameActive = false;
            clearInterval(gameCountdownIntervalId);
            clearTimeout(spawnTimeoutId);

            // Clean layout board state entirely
            holes.forEach(h => h.classList.remove('active'));

            overlayTitle.innerText = "TIME'S UP!";
            overlayDesc.innerText = `Great reflex coordination! You racked up a total score of ${score} points.`;
            overlayBtn.innerText = "PLAY AGAIN";
            overlay.style.display = 'flex';
        }
    </script>
</body>
</html>
